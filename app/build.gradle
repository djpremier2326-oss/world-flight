plugins {
    id 'com.android.application'
}

def maps3dApiKey = project.findProperty("MAPS3D_API_KEY") ?: System.getenv("MAPS3D_API_KEY") ?: "MISSING_API_KEY"

android {
    namespace 'com.worldflight'
    compileSdk 35

    defaultConfig {
        applicationId 'com.worldflight'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2-google3d'
        manifestPlaceholders = [MAPS3D_API_KEY: maps3dApiKey]
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps3d:16.0.1'
}
